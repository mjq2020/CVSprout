name: Verify
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  web-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements/web.txt --progress-spinner off
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements/worker-cpu.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_pipeline.py
      - run: python scripts/smoke_training_initialization.py
      - run: python scripts/smoke_open_source.py --device cpu
      - run: |
          for file in static/*.js; do node --check "$file"; done
          for file in scripts/check_*.mjs; do node "$file"; done
          bash -n start.sh
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.gpu.yaml config --quiet
      - run: docker build --target web -t cvsprout/web:ci .
